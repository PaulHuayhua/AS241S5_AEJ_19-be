# kubectl apply -f paul-huayhua-19-service.yml
apiVersion: v1
kind: Service
metadata:
  name: paul-huayhua-19-service
  namespace: paul-huayhua-19-namespace
spec:
  type: NodePort      # 30000-32767
  ports:
  - port: 8019        # Puerto que el Service expondrá
    targetPort: 8080  # Puerto en el contenedor donde tu aplicación escucha
    nodePort: 30019   # Puerto asignado en el nodo
  selector:
    app: paul-huayhua-19-deployment