server:
  port: ${PORT:8080}
  url: ${SERVER_URL:http://localhost:8080}

spring:
  application:
    name: paul-huayhua-api
  data:
    mongodb:
      uri: ${MONGODB_URI}

groq:
  api:
    key: ${GROQ_API_KEY}
    model: ${GROQ_MODEL}

rapidapi:
  key: ${RAPIDAPI_KEY}
  host-weather: ${RAPIDAPI_HOST_WEATHER}

logging:
  level:
    ap1.paul.huayhua: INFO
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework.data.mongodb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
