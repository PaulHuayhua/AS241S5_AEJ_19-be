name: Kubernetes Deploy Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions UI

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME_PAUL }}/as241s5_aej_19-be
  KUBE_NAMESPACE: paul-huayhua-19

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Ejecutar tests de Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: mvn test -B

      # 3. Build del proyecto con Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      # 4. Login a Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_PAUL }}
          password: ${{ secrets.DOCKERHUB_TOKEN_PAUL }}

      # 5. Extract metadata (tags, labels) para Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-

      # 6. Build y Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      # 1. Checkout del código (para acceder a manifests)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurar kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      # 3. Configurar Kubeconfig
      - name: Configure Kubernetes Context
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # 4. Verificar conexión al cluster
      - name: Verify Cluster Connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # 5. Crear namespace si no existe
      - name: Create Namespace
        run: |
          kubectl apply -f manifest/paul-huayhua-19-namespace.yml

      # 6. Aplicar secrets (solo si existen los secrets de GitHub)
      - name: Apply Secrets
        run: |
          # Reemplazar valores del secret con los de GitHub Secrets
          cat manifest/paul-huayhua-19-secret.yml | \
          sed "s|GROQ_API_KEY:.*|GROQ_API_KEY: $(echo -n '${{ secrets.GROQ_API_KEY }}' | base64)|g" | \
          sed "s|RAPIDAPI_KEY:.*|RAPIDAPI_KEY: $(echo -n '${{ secrets.RAPIDAPI_KEY }}' | base64)|g" | \
          sed "s|MONGODB_URI:.*|MONGODB_URI: $(echo -n '${{ secrets.MONGODB_URI }}' | base64)|g" | \
          kubectl apply -f -

      # 7. Aplicar Service
      - name: Apply Service
        run: |
          kubectl apply -f manifest/paul-huayhua-19-service.yml

      # 8. Aplicar Deployment con la nueva imagen
      - name: Deploy Application
        run: |
          # Actualizar la imagen en el deployment
          cat manifest/paul-huayhua-19-deployment.yml | \
          sed "s|image:.*|image: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-${{ github.sha }}|g" | \
          kubectl apply -f -

      # 9. Esperar a que el deployment esté listo
      - name: Wait for Deployment Rollout
        run: |
          kubectl rollout status deployment/paul-huayhua-19-deployment -n ${{ env.KUBE_NAMESPACE }} --timeout=5m

      # 10. Verificar el estado del deployment
      - name: Verify Deployment
        run: |
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
          kubectl get services -n ${{ env.KUBE_NAMESPACE }}

      # 11. Obtener URL del servicio (si es LoadBalancer o NodePort)
      - name: Get Service URL
        run: |
          echo "### Deployment Summary ###"
          echo "Namespace: ${{ env.KUBE_NAMESPACE }}"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-${{ github.sha }}"
          echo "Service:"
          kubectl get service paul-huayhua-19-service -n ${{ env.KUBE_NAMESPACE }}

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()

    steps:
      - name: Deployment Success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Deployment exitoso a Kubernetes"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-${{ github.sha }}"

      - name: Deployment Failed
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment falló"
          exit 1
