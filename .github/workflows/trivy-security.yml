name: Trivy Security Scan

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  schedule:
    # Ejecutar todos los días a las 8:00 AM hora Perú (UTC-5) → 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions UI

jobs:
  trivy-security:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurar JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3. Compilar el proyecto
      - name: Build Project
        run: mvn clean package -DskipTests

      # =========================================================
      # INSTALAR TRIVY
      # =========================================================
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # =========================================================
      # EJECUTAR TRIVY - Reporte completo por escala
      # UNKNOWN | LOW | MEDIUM | HIGH | CRITICAL
      # --exit-code 0 = VERDE (pipeline exitoso aunque haya vulnerabilidades)
      # --exit-code 1 = ROJO  (pipeline falla si encuentra vulnerabilidades)
      # =========================================================
      - name: Run Trivy Filesystem Scan
        run: |
          trivy fs . \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Pipeline Finished
        run: echo "Trivy scan completed successfully"
